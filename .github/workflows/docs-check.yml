name: Docs Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify key documents exist
        run: |
          test -f README.md
          test -f fls/FLS-002-Core-Ontology.md
          test -f adr/ADR-001-Primary-Representation.md
          echo "Core docs present."
      - name: Placeholder for future markdown lint
        run: echo "Docs-only repository. No executable code. Claims capped."
